name: UNEX Bot

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

permissions: write-all

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore offset cache
        id: cache-offset
        uses: actions/cache@v4
        with:
          path: /tmp/unex_offset.txt
          key: unex-offset-${{ github.run_id }}
          restore-keys: |
            unex-offset-

      - name: Run bot
        env:
          UNEX_BOT_TOKEN: ${{ secrets.UNEX_BOT_TOKEN }}
          UNEX_OWNER_ID: ${{ secrets.UNEX_OWNER_ID }}
        run: python bot_action.py
