name: UNEX Bot

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

permissions: write-all

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure offset variable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api /repos/${{ github.repository }}/actions/variables/UNEX_LAST_UPDATE --jq .name 2>/dev/null || \
          gh api -X POST /repos/${{ github.repository }}/actions/variables \
            -f name=UNEX_LAST_UPDATE -f value=0

      - name: Run bot
        env:
          UNEX_BOT_TOKEN: ${{ secrets.UNEX_BOT_TOKEN }}
          UNEX_OWNER_ID: ${{ secrets.UNEX_OWNER_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python bot_action.py
