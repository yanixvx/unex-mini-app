<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; position:relative; overflow:hidden; font-family:-apple-system,'SF Pro Display',Roboto,sans-serif; background:#f7f7f5; }
  .bg { position:absolute; inset:0; }
  .bg img { width:100%; height:100%; object-fit:cover; }
  .header { position:absolute; top:0; left:0; right:0; padding:40px 44px 0; z-index:3; display:flex; justify-content:space-between; align-items:center; }
  .brand { color:#111; font-size:28px; font-weight:800; background:rgba(255,255,255,.85); padding:10px 24px; border-radius:36px; box-shadow:0 4px 16px rgba(0,0,0,.08); }
  .badge { background:#ea5b13; color:#fff; font-size:24px; font-weight:800; padding:10px 24px; border-radius:36px; box-shadow:0 4px 16px rgba(234,91,19,.3); }
  .content { position:absolute; left:48px; right:48px; bottom:44px; color:#111; text-align:center; z-index:3; }
  .h1 { font-size:56px; font-weight:800; line-height:1.1; letter-spacing:-.5px; }
  .h1 span { color:#ea5b13; }
  .sub { margin-top:14px; font-size:28px; font-weight:700; color:#333; }
  .benefits { margin-top:18px; display:flex; justify-content:center; gap:12px; flex-wrap:wrap; }
  .ben { background:rgba(255,255,255,.92); border-radius:34px; padding:12px 24px; font-size:23px; font-weight:800; color:#111; box-shadow:0 4px 14px rgba(0,0,0,.08); }
  .price-row { margin-top:22px; display:flex; justify-content:center; align-items:baseline; gap:16px; }
  .price { font-size:72px; font-weight:800; color:#ea5b13; line-height:1; }
  .price small { font-size:26px; font-weight:600; color:#333; }
  .cta { margin-top:24px; display:inline-block; background:#111; color:#fff; font-size:32px; font-weight:800; padding:20px 44px; border-radius:50px; }
</style>
</head>
<body>
  <div class="bg"><img src="file:///Users/yan1xvx/Documents/unex_mini_app/img_gen/tpe_on_hand.jpg"></div>
  <div class="header">
    <div class="brand">🧤 UNEX</div>
    <div class="badge">🔥 СКИДКА</div>
  </div>
  <div class="content">
    <div class="h1">Чорні TPE рукавички — <span>простір і захист</span></div>
    <div class="sub">Для кухні, їжі та роботи</div>
    <div class="benefits">
      <div class="ben">🧼 Гігієнічні</div>
      <div class="ben">🛡 Міцні</div>
      <div class="ben">💨 Без запаху</div>
      <div class="ben">📦 200 шт</div>
    </div>
    <div class="price-row">
      <div class="price">180 <small>грн/уп</small></div>
    </div>
    <div class="cta">💬 Знижка в Telegram → @UNEX_UA</div>
  </div>
</body>
</html>
