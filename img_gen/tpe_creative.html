<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1080px; position:relative; overflow:hidden; font-family:-apple-system,'SF Pro Display',Roboto,sans-serif; background:#000; }
  .bg { position:absolute; inset:0; }
  .bg img { width:100%; height:100%; object-fit:cover; }
  .grad { position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,0.75) 100%); }
  .badge { position:absolute; top:48px; left:48px; background:#ea5b13; color:#fff; font-size:34px; font-weight:800; padding:18px 34px; border-radius:60px; box-shadow:0 8px 24px rgba(234,91,19,.45); letter-spacing:.5px; }
  .brand { position:absolute; top:52px; right:52px; color:#fff; font-size:30px; font-weight:800; background:rgba(0,0,0,.35); padding:14px 26px; border-radius:40px; letter-spacing:1px; }
  .content { position:absolute; left:48px; right:48px; bottom:52px; color:#fff; }
  .h1 { font-size:64px; font-weight:800; line-height:1.12; letter-spacing:-.5px; margin-bottom:20px; }
  .h1 span { color:#ffd000; }
  .price-row { display:flex; align-items:flex-end; gap:22px; margin-top:8px; }
  .price { font-size:96px; font-weight:800; line-height:1; color:#ffd000; letter-spacing:-1px; }
  .price small { font-size:36px; font-weight:600; color:#fff; letter-spacing:0; }
  .old { font-size:38px; color:#c9c9c9; text-decoration:line-through; font-weight:600; padding-bottom:10px; }
  .cta { margin-top:28px; display:inline-block; background:#fff; color:#111; font-size:34px; font-weight:800; padding:20px 40px; border-radius:50px; }
  .disc-badge { position:absolute; top:48px; left:50%; transform:translateX(-50%); background:#ffd000; color:#111; font-size:30px; font-weight:800; padding:14px 30px; border-radius:40px; box-shadow:0 6px 20px rgba(255,208,0,.4); }
</style>
</head>
<body>
  <div class="bg"><img src="file:///Users/yan1xvx/Documents/unex_mini_app/img_gen/tpe_pro.jpg"></div>
  <div class="grad"></div>
  <div class="badge">🔥 СКИДКА</div>
  <div class="disc-badge">тільки через Telegram</div>
  <div class="brand">🧤 UNEX</div>
  <div class="content">
    <div class="h1">TPE рукавички<br>для <span>їжі та кухні</span></div>
    <div class="price-row">
      <div class="price">175 <small>грн/уп</small></div>
      <div class="old">180 грн</div>
    </div>
    <div class="cta">💬 Напишіть @UNEX_UA</div>
  </div>
</body>
</html>
