<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; position:relative; overflow:hidden; font-family:-apple-system,'SF Pro Display',Roboto,sans-serif; background:#0e0e0e; }
  .bg-grad { position:absolute; inset:0; background:radial-gradient(130% 90% at 50% 0%, #222 0%, #0e0e0e 55%, #000 100%); }
  /* Верх: лого + бейдж */
  .header { position:absolute; top:0; left:0; right:0; padding:42px 40px 0; z-index:3; display:flex; justify-content:space-between; align-items:center; }
  .brand { color:#fff; font-size:30px; font-weight:800; background:rgba(255,255,255,.1); padding:10px 26px; border-radius:34px; letter-spacing:1px; }
  .badge { background:#ea5b13; color:#fff; font-size:24px; font-weight:800; padding:10px 24px; border-radius:34px; }
  /* Лозунг */
  .slogan { position:absolute; top:150px; left:48px; right:48px; text-align:center; z-index:3; }
  .slogan .line1 { color:#fff; font-size:56px; font-weight:800; line-height:1.12; letter-spacing:-.5px; }
  .slogan .line1 span { color:#ffd000; }
  .slogan .line2 { color:#ffd000; font-size:38px; font-weight:800; margin-top:14px; }
  /* Продукция: большой ряд фото */
  .prods { position:absolute; top:400px; left:36px; right:36px; display:flex; gap:16px; z-index:2; }
  .prod { flex:1; background:rgba(255,255,255,.05); border-radius:22px; padding:16px 10px 12px; text-align:center; }
  .prod img { width:100%; height:200px; object-fit:contain; }
  .prod .n { color:#fff; font-size:20px; font-weight:800; margin-top:10px; }
  .prod .s { color:#999; font-size:15px; font-weight:600; margin-top:2px; }
  /* Сегменты */
  .seg { position:absolute; top:850px; left:48px; right:48px; z-index:3; }
  .seg-row { display:flex; justify-content:center; gap:14px; }
  .seg-item { background:rgba(255,255,255,.08); border:2px solid rgba(255,208,0,.35); border-radius:40px; padding:14px 26px; color:#fff; font-size:24px; font-weight:700; display:flex; align-items:center; gap:10px; }
  /* CTA */
  .cta { position:absolute; left:48px; right:48px; bottom:46px; background:#ea5b13; color:#fff; text-align:center; font-size:36px; font-weight:800; padding:26px; border-radius:24px; z-index:3; }
  .cta small { display:block; font-size:20px; font-weight:600; color:rgba(255,255,255,.85); margin-top:6px; }
</style>
</head>
<body>
  <div class="bg-grad"></div>
  <div class="header">
    <div class="brand">🧤 UNEX</div>
    <div class="badge">ПРЯМИЙ ПОСТАЧАЛЬНИК</div>
  </div>
  <div class="slogan">
    <div class="line1">Рукавички для тих,<br>хто <span>працює руками</span></div>
    <div class="line2">Оптом і в роздріб</div>
  </div>
  <div class="prods">
    <div class="prod">
      <img src="file:///Users/yan1xvx/Documents/unex_mini_app/img/nitril42.png">
      <div class="n">Нітрил</div>
      <div class="s">медицина · салони</div>
    </div>
    <div class="prod">
      <img src="file:///Users/yan1xvx/Documents/unex_mini_app/img/maska2.png">
      <div class="n">Маски</div>
      <div class="s">захист щодня</div>
    </div>
    <div class="prod">
      <img src="file:///Users/yan1xvx/Documents/unex_mini_app/img/kraft_pak.png">
      <div class="n">Крафт-пакети</div>
      <div class="s">стерилізація</div>
    </div>
  </div>
  <div class="seg">
    <div class="seg-row">
      <div class="seg-item">🍳 Ресторани</div>
      <div class="seg-item">💅 Манікюр</div>
      <div class="seg-item">🏥 Медзакупки</div>
    </div>
  </div>
  <div class="cta">💬 @UNEX_UA — знижка на перший заказ
    <small>каталог: t.me/unexmedbot</small>
  </div>
</body>
</html>
