<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1080px; position:relative; overflow:hidden; font-family:-apple-system,'SF Pro Display',Roboto,sans-serif; background:#000; }
  .bg { position:absolute; inset:0; }
  .bg img { width:100%; height:100%; object-fit:cover; }
  .grad-top { position:absolute; top:0; left:0; right:0; height:300px; background:linear-gradient(180deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 100%); }
  .grad-bot { position:absolute; bottom:0; left:0; right:0; height:380px; background:linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%); }
  .badge { position:absolute; top:44px; left:44px; background:#ffd000; color:#111; font-size:32px; font-weight:800; padding:16px 32px; border-radius:60px; box-shadow:0 8px 24px rgba(255,208,0,.4); }
  .brand { position:absolute; top:48px; right:48px; color:#fff; font-size:30px; font-weight:800; background:rgba(0,0,0,.45); padding:14px 26px; border-radius:40px; letter-spacing:1px; }
  .content { position:absolute; left:48px; right:48px; bottom:44px; color:#fff; text-align:center; }
  .h1 { font-size:62px; font-weight:800; line-height:1.1; letter-spacing:-.5px; }
  .h1 span { color:#ffd000; }
  .price { margin-top:18px; font-size:44px; font-weight:800; color:#fff; }
  .price span { color:#ffd000; }
  .sub { margin-top:10px; font-size:28px; font-weight:600; color:#e8e8e8; }
  .cta { margin-top:24px; display:inline-block; background:#ea5b13; color:#fff; font-size:34px; font-weight:800; padding:20px 44px; border-radius:50px; box-shadow:0 10px 28px rgba(234,91,19,.5); }
</style>
</head>
<body>
  <div class="bg"><img src="file:///Users/yan1xvx/Downloads/rekawice-unex-L-niebieski-18595080341.jpg"></div>
  <div class="grad-top"></div>
  <div class="grad-bot"></div>
  <div class="badge">🎁 ПЕРШЕ ЗАМОВЛЕННЯ</div>
  <div class="brand">🧤 UNEX</div>
  <div class="content">
    <div class="h1">Нітрил 4г —<br><span>спеціальна ціна</span><br>на перший заказ</div>
    <div class="price">від <span>180 грн</span> / 100 шт</div>
    <div class="sub">XS • M • L • Сертифікати + документи</div>
    <div class="cta">💬 Окрема ціна → @UNEX_UA</div>
  </div>
</body>
</html>
