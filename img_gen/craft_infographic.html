<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; position:relative; overflow:hidden; font-family:-apple-system,'SF Pro Display',Roboto,sans-serif; background:#ffffff; }
  .top { position:relative; height:560px; overflow:hidden; }
  .top img { width:100%; height:100%; object-fit:cover; }
  .grad { position:absolute; top:0; left:0; right:0; height:120px; background:linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 100%); }
  .brand { position:absolute; top:24px; left:32px; color:#fff; font-size:28px; font-weight:800; background:rgba(0,0,0,.4); padding:10px 22px; border-radius:36px; }
  .badge { position:absolute; top:24px; right:32px; background:#ea5b13; color:#fff; font-size:26px; font-weight:800; padding:10px 24px; border-radius:36px; }  .body { padding:36px 44px; }
  .title { font-size:52px; font-weight:800; color:#111; line-height:1.1; letter-spacing:-.5px; margin-bottom:10px; }
  .title span { color:#ea5b13; }
  .subtitle { font-size:26px; color:#666; font-weight:500; margin-bottom:30px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .item { background:#f5f5f7; border-radius:20px; padding:24px; }
  .item .ic { font-size:34px; margin-bottom:10px; }
  .item .t { font-size:24px; font-weight:800; color:#111; margin-bottom:6px; }
  .item .d { font-size:19px; color:#555; line-height:1.35; }
  .pricebox { margin-top:26px; background:#111; border-radius:22px; padding:26px 30px; display:flex; align-items:center; justify-content:space-between; }
  .pricebox .lbl { color:#aaa; font-size:20px; font-weight:600; }
  .pricebox .val { color:#ffd000; font-size:46px; font-weight:800; }
  .pricebox .val small { font-size:20px; font-weight:600; color:#fff; }
  .cta { margin-top:26px; background:#ea5b13; color:#fff; text-align:center; font-size:32px; font-weight:800; padding:24px; border-radius:22px; }
</style>
</head>
<body>
  <div class="top">

      <div class="item"><div class="ic">📐</div><div class="t">Розмір</div><div class="d">100×200 мм — універсальний</div></div>

</html>
